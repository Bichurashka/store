repos:
  - repo: https://github.com/psf/black
    rev: 24.3.0  # Replace with latest version if needed
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/pre-commit/mirrors-isort
    rev: v5.10.0  # Replace with latest version if needed
    hooks:
      - id: isort
        language_version: python3

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0  # Replace with latest version if needed
    hooks:
      - id: flake8
        additional_dependencies: [flake8-bugbear]
        language_version: python3

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0  # Replace with latest version if needed
    hooks:
      - id: mypy
        language_version: python3