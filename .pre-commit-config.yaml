repos:
  - repo: https://github.com/psf/black
    rev: 25.1.0  # Replace with latest version if needed
    hooks:
      - id: black
        language_version: python3.12

  - repo: https://github.com/pre-commit/mirrors-isort
    rev: v5.10.0  # Replace with latest version if needed
    hooks:
      - id: isort
        language_version: python3.12

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0  # Replace with latest version if needed
    hooks:
      - id: flake8
        additional_dependencies: [flake8-bugbear]
        language_version: python3.12

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.16.1  # Replace with latest version if needed
    hooks:
      - id: mypy
        language: system
        entry: poetry run mypy