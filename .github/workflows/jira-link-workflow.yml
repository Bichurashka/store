name: Add Jira link to PR description

on:
  pull_request:
    types: [opened]

jobs:
  add-jira-link:
    runs-on: ubuntu-latest
    steps:
      - name: Extract Jira ticket from branch name
        id: extract
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          echo "Branch name: $BRANCH_NAME"

          # Извлекаем ключ задачи Jira (например, ABC-123)
          if [[ "$BRANCH_NAME" =~ ([A-Z]+-[0-9]+) ]]; then
            JIRA_ID="${BASH_REMATCH[1]}"
            echo "Jira ID found: $JIRA_ID"
            echo "jira_id=$JIRA_ID" >> $GITHUB_OUTPUT
          else
            echo "No Jira ID found in branch name."
            echo "jira_id=" >> $GITHUB_OUTPUT
          fi

      - name: Add Jira link to PR body
        if: steps.extract.outputs.jira_id != ''
        uses: peter-evans/pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            🔗 [Jira Ticket](https://sashken23.atlassian.net/browse/${{ steps.extract.outputs.jira_id }})